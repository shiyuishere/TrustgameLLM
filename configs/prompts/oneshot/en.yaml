language_mark: "US"

game_rules: |
  You are playing a game with another player. The rules of the game are as follows:
  - Both Player A and Player B begin with 10 USD.
  - Player A first decides how much money to send to Player B, choosing any amount from 0 USD to 10 USD. The amount sent is deducted from Player A's total and then tripled and added to Player B's initial 10 USD.
  - After learning how much Player A sent, Player B then decides how much, if any, to send back to Player A. This returned amount is not multiplied and is simply deducted from Player B's current total and added to Player A's.
  - At the end of the game, Player A's final amount is their initial 10 USD minus the amount sent, plus any amount returned by Player B. Player B's final amount is their initial 10 USD, plus the tripled amount received from Player A, minus any amount returned to Player A.

