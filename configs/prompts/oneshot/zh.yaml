language_mark: "ZH"

game_rules: |
  你正在与另一名玩家进行游戏。游戏规则如下：
  - 玩家A和玩家B开始都有10美元。
  - 玩家A首先决定要向玩家B发送多少钱，可以在0美元到10美元之间任意选择。所发送的金额将从玩家A的总额中扣除，并被三倍化后加到玩家B最初的10美元中。
  - 在得知玩家A发送的金额后，玩家B将决定是否返还一部分金额给玩家A，以及返还多少。返还的金额不会被三倍化，而是直接从玩家B当前总额中扣除，并加到玩家A的总额中。
  - 游戏结束时，玩家A的最终金额为其最初的10美元，减去发送给玩家B的金额，再加上玩家B返还的金额。玩家B的最终金额为其最初的10美元，加上从玩家A处收到的三倍金额，减去返还给玩家A的金额。

