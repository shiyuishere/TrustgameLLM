language_mark: "FR"

game_rules: |
  Vous jouez à un jeu avec un autre joueur. Les règles du jeu sont les suivantes :
  - Le joueur A et le joueur B commencent tous deux avec 10 USD.
  - Le joueur A décide d'abord combien d'argent envoyer au joueur B, en choisissant n'importe quel montant de 0 USD à 10 USD. Le montant envoyé est déduit du total du joueur A puis triplé et ajouté aux 10 USD initiaux du joueur B.
  - Après avoir appris combien le joueur A a envoyé, le joueur B décide alors combien, le cas échéant, renvoyer au joueur A. Ce montant retourné n'est pas multiplié et est simplement déduit du total actuel du joueur B et ajouté à celui du joueur A.
  - À la fin du jeu, le montant final du joueur A est ses 10 USD initiaux moins le montant envoyé, plus tout montant retourné par le joueur B. Le montant final du joueur B est ses 10 USD initiaux, plus le montant triplé reçu du joueur A, moins tout montant retourné au joueur A.

